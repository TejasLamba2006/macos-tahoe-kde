[Unit]
StartLimitIntervalSec=0

[Service]
LimitNOFILE=524288
Environment="QML_XHR_ALLOW_FILE_READ=1"
Environment="QML_IMPORT_PATH=%h/.local/lib/qml"
Environment="QML2_IMPORT_PATH=%h/.local/lib/qml"
Environment="QML_DISABLE_DISK_CACHE=1"
Environment="LD_PRELOAD=%h/.local/lib/libmacos_bartender.so"
Restart=always
RestartSec=2
